---
#ansible_user:
ansible_python_interpreter: /usr/bin/python3

# Manage UFW on fleet hosts (SSH + edge stack ports from trusted CIDRs).
firewall_enabled: false

# Enable anonymous public Samba share on active fleet hosts.
samba_enabled: false
samba_share_name: public
samba_share_path: /srv/samba/public

# Enable authenticated FTP on the Samba public share (opt-in per host/site).
ftp_enabled: false
# Explicit FTPS (AUTH TLS on port 21); opt-in. Self-signed cert generated when enabled.
ftp_tls_enabled: false

# Set to true to reboot after apt upgrade when /var/run/reboot-required exists.
reboot_after_upgrade: false
